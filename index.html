<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-sidebar:#faf9f6;
    --bg-main:#ffffff;
    --bg-bubble-user:#f0eee6;
    --bg-bubble-bot:transparent;
    --border:#e8e6df;
    --text:#2b2924;
    --text-soft:#7a7669;
    --accent:#0088b0;        /* Ciano de interface — cor de apoio, elementos interativos */
    --accent-soft:#e1f2f5;
    --brand-navy:#0b1b3f;    /* Azul ISA — reservado ao símbolo e wordmark */
    --hover:#f1efe9;
    --active:#ece9e1;
    --danger:#c0392b;
    --radius:14px;
    --sidebar-w:280px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--bg-main);
    color:var(--text);
    height:100vh;
    overflow:hidden;
  }

  .app{
    display:flex;
    height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:var(--sidebar-w);
    min-width:var(--sidebar-w);
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    transition:margin-left .22s ease;
  }

  .sidebar-header{
    padding:16px 14px 10px 14px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 4px 2px 8px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--brand-navy);
  }

  .brand-sub{
    font-size:11px;
    color:var(--text-soft);
    padding:0 8px 14px 26px;
  }

  .brand-logo{
    flex-shrink:0;
    display:block;
  }

  .sidebar-icon-btn{
    background:none;
    border:none;
    color:var(--text-soft);
    cursor:pointer;
    padding:6px;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .sidebar-icon-btn:hover{ background:var(--hover); color:var(--text); }

  .new-chat-btn{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding:9px 12px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:filter .15s ease;
    margin-top:10px;
  }
  .new-chat-btn:hover{ filter:brightness(1.06); }
  .new-chat-btn svg{ flex-shrink:0; }

  .sidebar-section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--text-soft);
    padding:16px 16px 6px 16px;
  }

  .conversation-list{
    flex:1;
    overflow-y:auto;
    padding:0 8px 8px 8px;
  }
  .conversation-list::-webkit-scrollbar{ width:6px; }
  .conversation-list::-webkit-scrollbar-thumb{ background:#ddd9cf; border-radius:6px; }

  .conv-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:2px;
  }
  .conv-item:hover{ background:var(--hover); }
  .conv-item.active{ background:var(--active); font-weight:500; }
  .conv-item .title{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
  }
  .conv-item .edit-btn{
    opacity:0;
    background:none;
    border:none;
    color:var(--text-soft);
    cursor:pointer;
    padding:4px 6px;
    border-radius:5px;
    display:flex;
    flex-shrink:0;
  }
  .conv-item:hover .edit-btn{ opacity:1; }
  .conv-item .edit-btn:hover{ color:var(--accent); background:var(--accent-soft); }

  .conv-rename-input{
    flex:1;
    font:inherit;
    font-size:13.5px;
    color:var(--text);
    background:#fff;
    border:1px solid var(--accent);
    border-radius:6px;
    padding:3px 6px;
    outline:none;
    min-width:0;
  }

  .empty-conv{
    color:var(--text-soft);
    font-size:13px;
    padding:14px 16px;
  }

  .user-footer{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-top:1px solid var(--border);
    cursor:default;
  }

  .user-avatar{
    width:30px;height:30px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    font-weight:600;
    flex-shrink:0;
    background-size:cover;
    background-position:center;
    overflow:hidden;
  }

  .user-name{
    flex:1;
    font-size:13.5px;
    font-weight:500;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .settings-btn{
    background:none;
    border:none;
    color:var(--text-soft);
    cursor:pointer;
    padding:6px;
    border-radius:7px;
    display:flex;
    flex-shrink:0;
  }
  .settings-btn:hover{ background:var(--hover); color:var(--text); }

  /* ---------- SIDEBAR COLLAPSE (desktop) ---------- */
  .expand-btn{
    display:none;
    position:fixed;
    top:14px;
    left:14px;
    z-index:25;
    width:34px;height:34px;
    border-radius:9px;
    background:#fff;
    border:1px solid var(--border);
    box-shadow:0 1px 4px rgba(0,0,0,.08);
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text-soft);
  }
  .expand-btn:hover{ background:var(--hover); color:var(--text); }

  @media (min-width:821px){
    .app.sidebar-collapsed .sidebar{
      margin-left:calc(-1 * var(--sidebar-w));
    }
    .app.sidebar-collapsed .expand-btn{
      display:flex;
    }
    .app.sidebar-collapsed .main .topbar{
      padding-left:58px;
    }
  }

  /* ---------- MAIN ---------- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
    min-width:0;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 20px;
    border-bottom:1px solid var(--border);
    font-size:14px;
    color:var(--text-soft);
  }

  .topbar-title-static{
    padding:3px 6px;
    color:var(--text);
    font-weight:500;
  }

  .menu-toggle{
    display:none;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--text);
    padding:6px;
    border-radius:6px;
  }
  .menu-toggle:hover{ background:var(--hover); }

  .chat-area{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 16px;
  }
  .chat-area::-webkit-scrollbar{ width:8px; }
  .chat-area::-webkit-scrollbar-thumb{ background:#eee; border-radius:8px; }

  .chat-inner{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    flex:1;
    padding-top:8px;
  }

  /* -------- greeting / empty state -------- */
  .greeting-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:6px;
    padding-bottom:120px;
  }
  .greeting-icon{
    width:44px;height:44px;border-radius:50%;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:10px;
    color:var(--accent);
  }
  .greeting-title{
    font-size:26px;
    font-weight:600;
    color:var(--text);
  }
  .greeting-sub{
    font-size:14.5px;
    color:var(--text-soft);
  }

  /* -------- messages -------- */
  .messages{
    display:flex;
    flex-direction:column;
    gap:22px;
    padding:20px 0 24px 0;
  }

  .msg-row{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .msg-row.user{ justify-content:flex-end; }

  .msg-avatar{
    width:28px;height:28px;border-radius:8px;
    background:var(--accent);
    color:#fff;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    font-weight:600;
  }

  .msg-bubble{
    max-width:78%;
    padding:11px 15px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg-row.user .msg-bubble{
    background:var(--bg-bubble-user);
    border-bottom-right-radius:4px;
  }
  .msg-row.bot .msg-bubble{
    background:var(--bg-bubble-bot);
    padding-left:0;
    border-bottom-left-radius:4px;
  }

  .attachment-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border:1px solid var(--border);
    padding:5px 10px;
    border-radius:8px;
    font-size:12.5px;
    margin-top:8px;
    color:var(--text-soft);
  }

  .typing-indicator{
    display:flex;
    align-items:center;
    padding:4px 0;
  }
  .typing-indicator img{
    width:26px;
    height:26px;
    display:block;
  }

  /* -------- composer -------- */
  .composer-wrap{
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:0 0 18px 0;
  }

  .pending-attachments{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:8px;
  }
  .pending-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--hover);
    border:1px solid var(--border);
    padding:6px 8px 6px 10px;
    border-radius:9px;
    font-size:12.5px;
  }
  .pending-chip button{
    background:none;border:none;cursor:pointer;
    color:var(--text-soft);
    font-size:13px;
    line-height:1;
  }
  .pending-chip button:hover{ color:var(--danger); }
  .pending-chip.recording{
    color:var(--danger);
    border-color:#eecfcb;
    background:#fbeeed;
  }

  .composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    border:1px solid var(--border);
    border-radius:20px;
    padding:8px 8px 8px 14px;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .composer:focus-within{
    border-color:var(--accent);
  }

  .composer textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    max-height:160px;
    padding:6px 0;
    background:transparent;
  }

  .icon-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--text-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, color .15s ease;
  }
  .icon-btn:hover{ background:var(--hover); color:var(--text); }
  .icon-btn.recording{
    background:#fbeeed;
    color:var(--danger);
  }
  .icon-btn.recording svg{ animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }

  .send-btn{
    background:var(--accent);
    color:#fff;
  }
  .send-btn:hover{ background:var(--accent); filter:brightness(1.08); }
  .send-btn:disabled{
    background:#e5e2da;
    color:#a9a599;
    cursor:not-allowed;
  }
  .send-btn:disabled:hover{ background:#e5e2da; }

  .model-select-wrap{
    position:relative;
    flex-shrink:0;
  }

  .model-pill{
    display:flex;
    align-items:center;
    gap:5px;
    height:34px;
    padding:0 10px;
    border-radius:17px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text-soft);
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
  }
  .model-pill:hover{ background:var(--hover); color:var(--text); }
  .model-pill svg{ flex-shrink:0; }

  .model-menu{
    display:none;
    position:absolute;
    bottom:calc(100% + 8px);
    right:0;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.12);
    padding:6px;
    min-width:210px;
    z-index:30;
  }
  .model-menu.show{ display:block; }

  .model-menu-item{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:none;
    background:none;
    cursor:pointer;
    text-align:left;
  }
  .model-menu-item:hover{ background:var(--hover); }
  .model-menu-item.active{ background:var(--accent-soft); }
  .model-menu-item .model-name{ font-size:13.5px; font-weight:600; color:var(--text); }
  .model-menu-item .model-desc{ font-size:11.5px; color:var(--text-soft); }

  .composer-hint{
    text-align:center;
    font-size:11.5px;
    color:var(--text-soft);
    margin-top:8px;
  }

  /* -------- overlay for mobile sidebar -------- */
  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.3);
    z-index:15;
  }

  @media (max-width:820px){
    .sidebar{
      position:fixed;
      top:0; bottom:0; left:0;
      z-index:20;
      margin-left:calc(-1 * var(--sidebar-w));
      box-shadow:2px 0 12px rgba(0,0,0,.08);
    }
    .sidebar.open{ margin-left:0; }
    .overlay.show{ display:block; }
    .menu-toggle{ display:flex; }
    .msg-bubble{ max-width:88%; }
    .expand-btn{ display:none !important; }
  }

  /* ---------- SETTINGS MODAL ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(30,28,22,.38);
    z-index:40;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }

  .modal{
    width:100%;
    max-width:440px;
    max-height:88vh;
    overflow-y:auto;
    background:#fff;
    border-radius:16px;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    display:flex;
    flex-direction:column;
  }

  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid var(--border);
  }
  .modal-header h2{
    font-size:16.5px;
    font-weight:600;
    color:var(--text);
  }

  .modal-body{
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .avatar-upload{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .avatar-preview{
    width:60px;height:60px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    font-weight:600;
    flex-shrink:0;
    background-size:cover;
    background-position:center;
    overflow:hidden;
  }

  .field-group{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field-label{
    font-size:12.5px;
    font-weight:600;
    color:var(--text-soft);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .field-hint{
    font-size:12px;
    color:var(--text-soft);
    margin-top:-2px;
  }

  .text-input, .textarea-input{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 12px;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    outline:none;
    background:#fff;
  }
  .text-input:focus, .textarea-input:focus{
    border-color:var(--accent);
  }
  .textarea-input{
    resize:vertical;
    min-height:90px;
    line-height:1.5;
  }

  .modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    padding:16px 20px;
    border-top:1px solid var(--border);
  }

  .btn{
    padding:9px 16px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    border:none;
  }
  .btn-secondary{
    background:var(--hover);
    color:var(--text);
  }
  .btn-secondary:hover{ background:var(--active); }
  .btn-primary{
    background:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
</style>
</head>
<body>

<div class="app" id="appRoot">

  <div class="overlay" id="overlay"></div>

  <button class="expand-btn" id="expandBtn" title="Mostrar barra lateral">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
  </button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand-row">
        <div class="brand">
          <svg class="brand-logo" width="20" height="20" viewBox="0 0 64 64" role="img" aria-label="ISA">
            <g stroke="#0B1B3F" stroke-width="7" stroke-linecap="round">
              <line x1="42" y1="32" x2="58" y2="32"></line>
              <line x1="6" y1="32" x2="22" y2="32"></line>
              <line x1="32" y1="42" x2="32" y2="58"></line>
              <line x1="32" y1="6" x2="32" y2="22"></line>
              <line x1="39.07" y1="39.07" x2="50.38" y2="50.38"></line>
              <line x1="24.93" y1="24.93" x2="13.62" y2="13.62"></line>
              <line x1="39.07" y1="24.93" x2="50.38" y2="13.62"></line>
              <line x1="24.93" y1="39.07" x2="13.62" y2="50.38"></line>
            </g>
          </svg>
          ISA
        </div>
        <button class="sidebar-icon-btn" id="collapseBtn" title="Esconder barra lateral">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>
      <div class="brand-sub">Inteligência de Suporte ao Atendimento</div>
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nova conversa
      </button>
    </div>

    <div class="sidebar-section-label">Conversas</div>
    <div class="conversation-list" id="conversationList">
      <!-- itens inseridos via JS -->
    </div>

    <div class="user-footer" id="userFooter">
      <div class="user-avatar" id="userAvatar">R</div>
      <div class="user-name" id="userName">Rick</div>
      <button class="settings-btn" id="settingsBtn" title="Configurações">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span id="topbarTitle" class="topbar-title-static">Nova conversa</span>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-inner" id="chatInner">
        <div class="greeting-wrap" id="greetingWrap">
          <div class="greeting-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 2v4"/><path d="M12 12l4 2"/></svg>
          </div>
          <div class="greeting-title" id="greetingTitle">Boa tarde</div>
          <div class="greeting-sub">Como posso ajudar você hoje?</div>
        </div>
        <div class="messages" id="messages" style="display:none;"></div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="pending-attachments" id="pendingAttachments"></div>

      <div class="composer">
        <button class="icon-btn" id="attachBtn" title="Anexar arquivo">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg>
        </button>
        <input type="file" id="fileInput" multiple hidden>

        <textarea id="messageInput" placeholder="Escreva para a ISA…" rows="1"></textarea>

        <div class="model-select-wrap">
          <button class="model-pill" id="modelSelectBtn" title="Selecionar modelo">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            <span id="modelSelectLabel">Cerberus Fast</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="model-menu" id="modelMenu">
            <button class="model-menu-item" data-model="think">
              <span class="model-name">Cerberus Think</span>
              <span class="model-desc">Pensa com mais calma para respostas complexas</span>
            </button>
            <button class="model-menu-item" data-model="fast">
              <span class="model-name">Cerberus Fast</span>
              <span class="model-desc">Respostas rápidas para o dia a dia</span>
            </button>
          </div>
        </div>

        <button class="icon-btn" id="micBtn" title="Gravar áudio">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>

        <button class="icon-btn send-btn" id="sendBtn" disabled title="Enviar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
      <div class="composer-hint">A ISA pode cometer erros. Sempre verifique as respostas.</div>
    </div>
  </main>

</div>

<!-- ---------- SETTINGS MODAL ---------- -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Configurações</h2>
      <button class="sidebar-icon-btn" id="closeSettingsBtn" title="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="field-group">
        <span class="field-label">Sua foto</span>
        <div class="avatar-upload">
          <div class="avatar-preview" id="avatarPreview">R</div>
          <button class="btn btn-secondary" id="changePhotoBtn">Alterar foto</button>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="userNameInput">Seu nome</label>
        <input type="text" id="userNameInput" class="text-input" placeholder="Como o Cerberus deve te chamar">
      </div>

      <div class="field-group">
        <label class="field-label" for="personaInput">Como quer que eu atue?</label>
        <textarea id="personaInput" class="textarea-input" placeholder="Ex: Seja direto, sem enrolação. Me chame pelo primeiro nome. Prefiro respostas curtas e objetivas."></textarea>
        <span class="field-hint">Essas instruções vão guiar o tom e o estilo das respostas.</span>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelSettingsBtn">Cancelar</button>
      <button class="btn btn-primary" id="saveSettingsBtn">Salvar</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ---------- estado em memória ----------
  let conversations = [];   // {id, title, messages:[{role, text, attachments:[{name,type,url}]}]}
  let activeId = null;
  let pendingAttachments = []; // anexos selecionados antes de enviar
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;

  let currentUser = { name: 'Rick', persona: '', photoDataUrl: null };
  let pendingAvatarDataUrl = null; // foto selecionada no modal, antes de salvar

  // ---------- elementos ----------
  const appRoot = document.getElementById('appRoot');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const menuToggle = document.getElementById('menuToggle');
  const collapseBtn = document.getElementById('collapseBtn');
  const expandBtn = document.getElementById('expandBtn');
  const conversationList = document.getElementById('conversationList');
  const newChatBtn = document.getElementById('newChatBtn');
  const greetingWrap = document.getElementById('greetingWrap');
  const greetingTitle = document.getElementById('greetingTitle');
  const messagesEl = document.getElementById('messages');
  const topbarTitle = document.getElementById('topbarTitle');
  const settingsBtn = document.getElementById('settingsBtn');
  const chatArea = document.getElementById('chatArea');

  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const micBtn = document.getElementById('micBtn');
  const pendingAttachmentsEl = document.getElementById('pendingAttachments');

  const modelSelectBtn = document.getElementById('modelSelectBtn');
  const modelMenu = document.getElementById('modelMenu');
  const modelSelectLabel = document.getElementById('modelSelectLabel');
  let selectedModel = 'fast'; // 'think' | 'fast'

  const userAvatarEl = document.getElementById('userAvatar');
  const userNameEl = document.getElementById('userName');

  // ---------- settings modal elements ----------
  const settingsOverlay = document.getElementById('settingsOverlay');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');
  const cancelSettingsBtn = document.getElementById('cancelSettingsBtn');
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  const avatarPreview = document.getElementById('avatarPreview');
  const changePhotoBtn = document.getElementById('changePhotoBtn');
  const avatarInput = document.getElementById('avatarInput');
  const userNameInput = document.getElementById('userNameInput');
  const personaInput = document.getElementById('personaInput');

  // ---------- saudação por horário ----------
  function updateGreeting(){
    const h = new Date().getHours();
    let text = 'Boa noite';
    if (h >= 5 && h < 12) text = 'Bom dia';
    else if (h >= 12 && h < 18) text = 'Boa tarde';
    greetingTitle.textContent = currentUser.name ? `${text}, ${currentUser.name}` : text;
  }
  updateGreeting();
  setInterval(updateGreeting, 60000);

  // ---------- sidebar mobile (overlay off-canvas) ----------
  menuToggle.addEventListener('click', () => {
    sidebar.classList.add('open');
    overlay.classList.add('show');
  });
  overlay.addEventListener('click', closeSidebarMobile);
  function closeSidebarMobile(){
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  }

  // ---------- sidebar collapse (desktop, persistente) ----------
  collapseBtn.addEventListener('click', () => {
    appRoot.classList.add('sidebar-collapsed');
  });
  expandBtn.addEventListener('click', () => {
    appRoot.classList.remove('sidebar-collapsed');
  });

  // ---------- criar / trocar conversa ----------
  function createConversation(){
    const conv = { id: Date.now().toString(), title: null, messages: [] };
    conversations.unshift(conv);
    activeId = conv.id;
    renderConversationList();
    renderChat();
    messageInput.focus();
  }

  function setActive(id){
    activeId = id;
    renderConversationList();
    renderChat();
    closeSidebarMobile();
  }

  function getActive(){
    return conversations.find(c => c.id === activeId) || null;
  }

  function renameConversationInline(conv, item){
    const titleEl = item.querySelector('.title');
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'conv-rename-input';
    input.value = conv.title || 'Nova conversa';

    titleEl.replaceWith(input);
    input.focus();
    input.select();

    function finish(){
      const newTitle = input.value.trim();
      if (newTitle) conv.title = newTitle.slice(0, 60);
      renderConversationList();
      renderChat();
    }
    input.addEventListener('blur', finish);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){ e.preventDefault(); input.blur(); }
      if (e.key === 'Escape'){ input.value = conv.title || ''; input.blur(); }
    });
    input.addEventListener('click', (e) => e.stopPropagation());
  }

  function renderConversationList(){
    conversationList.innerHTML = '';
    if (!conversations.length){
      const empty = document.createElement('div');
      empty.className = 'empty-conv';
      empty.textContent = 'Nenhuma conversa ainda.';
      conversationList.appendChild(empty);
      return;
    }
    conversations.forEach(conv => {
      const item = document.createElement('div');
      item.className = 'conv-item' + (conv.id === activeId ? ' active' : '');
      item.addEventListener('click', () => setActive(conv.id));

      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = conv.title || 'Nova conversa';

      const editBtn = document.createElement('button');
      editBtn.className = 'edit-btn';
      editBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
      editBtn.title = 'Renomear conversa';
      editBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        renameConversationInline(conv, item);
      });

      item.appendChild(title);
      item.appendChild(editBtn);
      conversationList.appendChild(item);
    });
  }

  function renderChat(){
    const conv = getActive();
    if (!conv || conv.messages.length === 0){
      greetingWrap.style.display = 'flex';
      messagesEl.style.display = 'none';
      messagesEl.innerHTML = '';
      topbarTitle.textContent = 'Nova conversa';
      updateGreeting();
      return;
    }
    greetingWrap.style.display = 'none';
    messagesEl.style.display = 'flex';
    topbarTitle.textContent = conv.title || 'Conversa';
    messagesEl.innerHTML = '';

    conv.messages.forEach(msg => {
      messagesEl.appendChild(buildMessageRow(msg));
    });
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function buildMessageRow(msg){
    const row = document.createElement('div');
    row.className = 'msg-row ' + (msg.role === 'user' ? 'user' : 'bot');

    if (msg.role !== 'user'){
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = 'I';
      row.appendChild(avatar);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.text || '';

    if (msg.attachments && msg.attachments.length){
      msg.attachments.forEach(att => {
        const chip = document.createElement('div');
        chip.className = 'attachment-chip';
        chip.innerHTML = attachmentIcon(att.type) + ' ' + escapeHtml(att.name);
        bubble.appendChild(document.createElement('br'));
        bubble.appendChild(chip);
      });
    }

    row.appendChild(bubble);
    return row;
  }

  function attachmentIcon(type){
    if (type === 'audio') return '&#127908;';
    if (type === 'image') return '&#128247;';
    return '&#128206;';
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- envio de mensagem ----------
  function updateSendState(){
    const hasText = messageInput.value.trim().length > 0;
    sendBtn.disabled = !hasText && pendingAttachments.length === 0;
  }

  messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
    updateSendState();
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function sendMessage(){
    const text = messageInput.value.trim();
    if (!text && pendingAttachments.length === 0) return;

    if (!getActive()) createConversation();
    const conv = getActive();

    const userMsg = { role:'user', text, attachments: pendingAttachments.slice() };
    conv.messages.push(userMsg);

    if (!conv.title){
      conv.title = (text || (pendingAttachments[0] && pendingAttachments[0].name) || 'Nova conversa').slice(0, 42);
    }

    pendingAttachments = [];
    renderPendingAttachments();
    messageInput.value = '';
    messageInput.style.height = 'auto';
    updateSendState();

    renderConversationList();
    renderChat();

    showTyping();
    setTimeout(() => {
      hideTyping();
      conv.messages.push({ role:'bot', text: fakeReply(text) });
      renderChat();
    }, 900);
  }

  function fakeReply(userText){
    if (!userText) return 'Recebi seu anexo! (isto é apenas um layout de exemplo, ainda sem IA conectada)';
    return 'Você disse: "' + userText + '"\n\n(Esta é uma resposta de exemplo — ainda não há um modelo de IA conectado.)';
  }

  function showTyping(){
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingRow';

    messagesEl.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }
  function hideTyping(){
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  // ---------- anexar arquivo ----------
  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    Array.from(fileInput.files).forEach(file => {
      const type = file.type.startsWith('image/') ? 'image' : (file.type.startsWith('audio/') ? 'audio' : 'file');
      pendingAttachments.push({ name:file.name, type, url:URL.createObjectURL(file) });
    });
    fileInput.value = '';
    renderPendingAttachments();
    updateSendState();
  });

  function renderPendingAttachments(){
    pendingAttachmentsEl.innerHTML = '';
    pendingAttachments.forEach((att, idx) => {
      const chip = document.createElement('div');
      chip.className = 'pending-chip' + (att.recording ? ' recording' : '');
      chip.innerHTML = attachmentIcon(att.type) + ' <span>' + escapeHtml(att.name) + '</span>';
      const removeBtn = document.createElement('button');
      removeBtn.innerHTML = '&#10005;';
      removeBtn.addEventListener('click', () => {
        pendingAttachments.splice(idx, 1);
        renderPendingAttachments();
        updateSendState();
      });
      chip.appendChild(removeBtn);
      pendingAttachmentsEl.appendChild(chip);
    });
  }

  // ---------- gravação de áudio ----------
  micBtn.addEventListener('click', async () => {
    if (!isRecording){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type:'audio/webm' });
          const url = URL.createObjectURL(blob);
          pendingAttachments.push({ name:'Áudio gravado', type:'audio', url });
          renderPendingAttachments();
          updateSendState();
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add('recording');
        micBtn.title = 'Parar gravação';
      }catch(err){
        alert('Não foi possível acessar o microfone. Verifique as permissões do navegador.');
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.title = 'Gravar áudio';
    }
  });

  // ---------- seletor de modelo (Think / Fast) ----------
  function updateModelLabel(){
    modelSelectLabel.textContent = selectedModel === 'think' ? 'Cerberus Think' : 'Cerberus Fast';
    modelMenu.querySelectorAll('.model-menu-item').forEach(item => {
      item.classList.toggle('active', item.dataset.model === selectedModel);
    });
  }

  modelSelectBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    modelMenu.classList.toggle('show');
  });

  modelMenu.querySelectorAll('.model-menu-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedModel = item.dataset.model;
      updateModelLabel();
      modelMenu.classList.remove('show');
    });
  });

  document.addEventListener('click', () => modelMenu.classList.remove('show'));

  updateModelLabel();

  // ---------- configurações ----------
  function renderUserFooter(){
    userNameEl.textContent = currentUser.name || 'Você';
    setAvatarVisual(userAvatarEl, currentUser.name, currentUser.photoDataUrl);
  }

  function setAvatarVisual(el, name, dataUrl){
    if (dataUrl){
      el.style.backgroundImage = `url(${dataUrl})`;
      el.textContent = '';
    } else {
      el.style.backgroundImage = 'none';
      el.textContent = (name || '?').trim().charAt(0).toUpperCase() || '?';
    }
  }

  function openSettings(){
    userNameInput.value = currentUser.name || '';
    personaInput.value = currentUser.persona || '';
    pendingAvatarDataUrl = currentUser.photoDataUrl;
    setAvatarVisual(avatarPreview, currentUser.name, currentUser.photoDataUrl);
    settingsOverlay.classList.add('show');
  }

  function closeSettings(){
    settingsOverlay.classList.remove('show');
  }

  settingsBtn.addEventListener('click', openSettings);
  closeSettingsBtn.addEventListener('click', closeSettings);
  cancelSettingsBtn.addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) closeSettings();
  });

  changePhotoBtn.addEventListener('click', () => avatarInput.click());
  avatarInput.addEventListener('change', () => {
    const file = avatarInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingAvatarDataUrl = reader.result;
      setAvatarVisual(avatarPreview, userNameInput.value, pendingAvatarDataUrl);
    };
    reader.readAsDataURL(file);
  });

  userNameInput.addEventListener('input', () => {
    if (!pendingAvatarDataUrl) setAvatarVisual(avatarPreview, userNameInput.value, null);
  });

  saveSettingsBtn.addEventListener('click', () => {
    currentUser.name = userNameInput.value.trim() || 'Você';
    currentUser.persona = personaInput.value.trim();
    currentUser.photoDataUrl = pendingAvatarDataUrl;
    renderUserFooter();
    updateGreeting();
    closeSettings();
  });

  // ---------- início ----------
  newChatBtn.addEventListener('click', createConversation);
  renderConversationList();
  renderChat();
  renderUserFooter();
  updateSendState();
})();
</script>
